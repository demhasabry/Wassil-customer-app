name: iOS unsigned build (local emulator)

# Produces an UNSIGNED, PROFILE-mode .ipa artifact — no Apple Developer
# account or certificates involved anywhere in this workflow. Signing
# happens later, on-device, when you sideload via AltStore/AltServer using
# your own free Apple ID.
#
# --profile, not --debug: iOS 14+ refuses to launch a debug-mode Flutter
# build standalone (outside Xcode/Flutter tooling) at all, which is exactly
# what sideloading needs to do. A USE_LOCAL_EMULATORS dart-define (see
# main.dart) makes this profile build still connect to a Firebase emulator
# instead of the real (currently undeployed) Firebase project. That
# emulator has to be YOUR PC's, reachable over WiFi — same setup as testing
# the Android app physically: run `firebase emulators:start` on your PC,
# keep the iPhone on the SAME WiFi network, then trigger this workflow with
# your PC's current LAN IP (run `ipconfig`, look under your WiFi adapter
# for "IPv4 Address").
on:
  workflow_dispatch:
    inputs:
      emulator_host:
        description: "Your PC's LAN IP (ipconfig -> WiFi adapter -> IPv4 Address). Phone and PC must be on the same WiFi."
        required: true
        type: string
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Add the DeliveryWidget Live Activity extension target
        # Adds a native Widget Extension target to Runner.xcodeproj via the
        # `xcodeproj` gem (the same library CocoaPods/fastlane use for this
        # kind of project surgery) rather than a checked-in, hand-edited
        # project file — this repo has no Mac available to add the target
        # through Xcode's own UI. See ios/add_widget_extension.rb for the
        # full reasoning. Idempotent — safe on every run.
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_widget_extension.rb

      - name: Build profile iOS app pointed at the local Firebase emulator
        # --profile, not --debug — iOS 14+ refuses to launch a debug-mode
        # Flutter build standalone at all (outside Xcode/Flutter tooling),
        # which is exactly what sideloading via AltStore needs to do.
        # USE_LOCAL_EMULATORS=true is what makes main.dart connect to the
        # emulator despite not being a debug build (see main.dart's comment).
        # The '10.0.2.2' fallback only matters for an automatic push-trigger
        # build (no input given) — it's the Android-emulator alias and does
        # nothing useful on iOS, so always use "Run workflow" with your real
        # LAN IP when you actually intend to test on your phone.
        run: |
          flutter build ios --profile --no-codesign \
            --dart-define=USE_LOCAL_EMULATORS=true \
            --dart-define=EMULATOR_HOST=${{ github.event.inputs.emulator_host || '10.0.2.2' }}

      - name: Ad-hoc sign to embed entitlements for AltServer to read
        # --no-codesign means NO codesign step ever runs during the build
        # above, so the binaries carry zero entitlements — CODE_SIGN_ENTITLEMENTS
        # in the Xcode project only controls what a real codesign step WOULD
        # embed, and none does. AltServer's signer (AltSign) can only grant a
        # capability (here, the App Group the Dynamic Island / Live Activity
        # needs to actually receive live content, not just start) that it can
        # read off an *existing* entitlements blob on the binary when it
        # resigns on your PC — with nothing there, it silently falls back to
        # a minimal default with no App Group, which is exactly why the
        # widget always saw an empty shared container despite everything
        # else building and installing fine. Ad-hoc signing (identity "-")
        # needs no certificate or Apple ID — it only exists to attach a
        # readable entitlements blob for AltServer to discover and reproduce
        # later; it is NOT the real signature the phone will run with.
        # Nested code signs before the containing bundle, matching Apple's
        # own signing order.
        run: |
          codesign --force --sign - --entitlements ios/DeliveryWidget/DeliveryWidget.entitlements \
            build/ios/iphoneos/Runner.app/PlugIns/DeliveryWidget.appex
          codesign --force --sign - --entitlements ios/Runner/Runner.entitlements \
            build/ios/iphoneos/Runner.app

      - name: Package into an .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../customer_app-profile.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: customer_app-profile-ipa
          path: customer_app-profile.ipa
          retention-days: 14
