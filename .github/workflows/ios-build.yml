name: iOS unsigned build

# Produces an UNSIGNED .ipa artifact — no Apple Developer account or
# certificates involved anywhere in this workflow. Signing happens later,
# on-device, when you sideload via AltStore/AltServer using your own free
# Apple ID. This just proves the app actually compiles for iOS and hands
# you something AltStore can re-sign.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package into an .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../customer_app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: customer_app-unsigned-ipa
          path: customer_app-unsigned.ipa
          retention-days: 14
