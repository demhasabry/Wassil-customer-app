name: delivery_customer_app
description: Customer app for the Atbara delivery bidding platform.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.9.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  cloud_functions: ^6.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  mapbox_maps_flutter: ^2.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.1
  http: ^1.2.0
  shared_preferences: ^2.3.3
  firebase_storage: ^13.5.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  flutter_svg: ^2.0.10+1
  audioplayers: ^6.1.0
  live_activities: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/motorcycle_icon.png
    - assets/vehicles/
    - assets/vehicle_markers/
    - assets/logo/
    - assets/sounds/
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
